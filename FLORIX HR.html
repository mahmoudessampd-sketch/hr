function conduct(id){const e=E(id);frm('شهادة / تقرير حسن سير وسلوك',[['to','موجّه إلى'],['rt','تقدير السلوك',['ممتاز','جيد جداً','جيد','مقبول']],['rm','ملاحظات إضافية','ta']],{to:'من يهمه الأمر',rt:'جيد'},o=>{const q=S.inq.filter(z=>z.e==id),pn=q.filter(z=>!['لم يتقرر بعد','لا إجراء'].includes(z.res)).length,act=e.ss=='قائم';

function custPrint(eid){const L=eid?[E(eid)]:S.emps.filter(e=>e.st&&(/مندوب/.test(e.j)||custOf(e.id).length)),all=eid?L:L;pr(hd('نموذج جرد ومطابقة العهد')+L.map((e,i)=>{const C=custOf(e.id);return`<h4>الموظف: ${esc(e.n)} — ${esc(e.j)}</h4><table><tr><th>م</th><th>النوع</th><th>بيان العهدة</th><th>العدد</th><th>اللوحة / التسلسلي</th><th>القيمة</th><th>تاريخ الاستلام</th><th>المطابقة المسجّلة</th><th>مطابق ☐</th><th>غير مطابق ☐</th><th>ملاحظات</th></tr>`+(C.map((c,j)=>`<tr><td>${j+1}</td><td>${c.ty||'—'}</td><td style="text-align:start">${esc(c.ds)}</td><td>${c.q||1}</td><td>${esc(c.pn||'')||'—'}</td><td>${f(c.v)}</td><td>${c.d}</td><td>${c.vf||'لم تُطابق'}${c.vd?' '+c.vd:''}</td><td>☐</td><td>☐</td><td style="min-width:90px"></td></tr>`).join('')||'<tr><td colspan="11">لا توجد عُهد مسجّلة على الموظف</td></tr>')+`<tr><th colspan="3">إجمالي العهد</th><th>${sm(C,c=>c.q||1)}</th><th></th><th>${f(sm(C,c=>c.v))}</th><th colspan="5"></th></tr></table><p>أقرّ بأن العُهد المبيّنة أعلاه بحوزتي وأنها مطابقة للجرد الفعلي بتاريخ ....../....../......</p><div class="sg"><span>المندوب / الموظف<br><br>..........</span><span>مدير القسم<br><br>..........</span><span>${stamp()}</span></div>${i<L.length-1?'<div style="page-break-after:always"></div>':''}`}).join(''),'portrait')}
function cVer(id){frm('مطابقة العهدة',[['vf','نتيجة المطابقة',['مطابقة','غير مطابقة']],['vd','تاريخ المطابقة','date'],['vn','ملاحظات المطابقة']],{vf:'مطابقة',vd:today()},o=>ups('cust',id,o,'c'))}
function prof(id){const x=empFacts(id),e=x.e,g=e.b+e.h+e.o;openM(`<h3>${esc(e.n)} <span class="bd" style="background:${e.ss=='قائم'?'var(--ok)':'var(--dn)'}">${e.ss}</span></h3><div class="g2"><div>الوظيفة: <b>${esc(e.j)||'—'}</b></div><div>الجنسية: <b>${e.nat}</b></div><div>المباشرة: <b>${e.sd||'—'}</b> ${e.sd?'('+ten(yrs(e.sd))+')':''}</div><div>إجمالي الراتب: <b>${f(g)}</b></div><div>رصيد الإجازة: <b>${e.sd?f(x.b.b)+' يوم':'—'}</b></div><div>سلف متبقية: <b>${f(x.lo)}</b></div><div>عُهد بحوزته: <b>${x.cu.length} (${f(sm(x.cu,c=>c.v))})</b></div><div>غياب آخر شهر: <b>${x.ab} يوم</b></div>${DK.map(([k,l])=>`<div>${l}: ${e[k]?e[k]+' '+bg(dl(e[k])):'—'}</div>`).join('')}</div><div class="bar"><button class="p" onclick="closeM();go2('${id}')">كشف الحساب</button><button onclick="closeM();statusRep('${id}')">تقرير الحالة</button><button onclick="closeM();conduct('${id}')">حسن سير وسلوك</button><button onclick="closeM();lvEdit('','${id}')">طلب إجازة</button><button onclick="closeM();custPrint('${id}')">نموذج العهد</button><button onclick="closeM();clearance('${id}')">إخلاء طرف</button><button onclick="closeM();lvSettle('${id}')">تصفية الإجازة</button><button onclick="closeM();vacE('${id}')">تصفية نزول إجازة</button><button onclick="closeM();ltNew('${id}')">خطاب</button><button onclick="closeM();cMin('rec','${id}')">محضر استلام عهدة</button><button onclick="closeM();cMin('ret','${id}')">محضر تسليم عهدة</button><button onclick="closeM();inqEdit()">استجواب</button><button onclick="closeM();eEdit('${id}')">تعديل</button><button onclick="closeM()">إغلاق</button></div>`)}
const F=[['n','الاسم'],['j','الوظيفة'],['no','الرقم الوظيفي'],['rs','رقم الإقامة / الهوية الوطنية'],['b','الأساسي','number'],['h','بدل السكن','number'],['o','بدلات أخرى','number'],['ph','الجوال (واتساب)'],['em','البريد الإلكتروني'],['nat','الجنسية / الكفالة',['وافد','سعودي','ليس كفالة']],['car','لديه سيارة',['نعم','لا']],['rd','انتهاء الإقامة / الهوية','date'],['mi','انتهاء التأمين الطبي','date'],['ld','انتهاء رخصة القيادة','date'],['sd','تاريخ مباشرة العمل','date'],['ss','حالة الموظف',SS],['sdt','تاريخ الإيقاف / الفصل / انتهاء الخدمة','date'],['sr','سبب أو رقم قرار الإيقاف / الفصل'],['bk','البنك'],['ib','رقم الآيبان'],['ah','اسم صاحب الحساب (إن كان الراتب يُحوَّل لحساب شخص آخر)'],['gs','نظام التأمينات الاجتماعية (للسعودي)',['جديد','قديم']],['tk','قيمة تذكرة الطيران (فارغ = الافتراضي)','number'],['tkq','عدد التذاكر المستحقة (مع العائلة)','number']];
function vEmps(){return`<div class="bar">${qi()}<button class="p" onclick="eEdit()">+ موظف</button><button class="p" onclick="svEdit()">+ موظف سعودي</button></div><div class="w"><table><tr><th>#</th><th>الاسم</th><th>الوظيفة</th><th>الإقامة</th><th>الإجمالي</th><th>المباشرة</th><th>الحالة</th><th></th></tr>`+S.emps.filter(e=>hit(e.n+e.j+e.no+e.rs)).map((e,i)=>`<tr><td>${i+1}</td><td><a href="#" onclick="prof('${e.id}');return false" style="color:var(--pr)">${esc(e.n)}</a></td><td>${esc(e.j)}</td><td>${esc(e.rs)}</td><td>${f(e.b+e.h+e.o)}</td><td>${e.sd||'—'}</td><td>${e.ss}</td><td><button onclick="eEdit('${e.id}')">تعديل</button> <button onclick="prof('${e.id}')">ملف</button> <button onclick="go2('${e.id}')">تقرير</button> ${e.ss!='قائم'?`<button onclick="decision('${e.id}')">قرار</button> `:''}<button onclick="settle('${e.id}')">تصفية</button> <button class="d" onclick="eDel('${e.id}')">حذف</button></td></tr>`).join('')+'</table></div>'}
const go2=id=>{st.emp=id;st.rm='';go('rep')};
function eEdit(id){const e=S.emps.find(x=>x.id==id)||{st:1};openM(`<h3>${id?'تعديل':'إضافة'} موظف</h3><div class="g2">`+F.map(([k,l,t])=>Array.isArray(t)?`<label>${l}<select id="f_${k}">${t.map(o=>`<option ${o==e[k]?'selected':''}>${o}</option>`).join('')}</select></label>`:`<label>${l}<input id="f_${k}" type="${t||'text'}" value="${esc(e[k]||'')}"></label>`).join('')+`</div><div class="bar"><button class="p" onclick="eSave('${id||''}')">حفظ</button><button onclick="closeM()">إلغاء</button></div>`)}
function eSave(id){const o={};F.forEach(([k,,t])=>{const v=$('#f_'+k).value.trim();o[k]=t=='number'?+v||0:v});o.st=o.ss=='قائم'?1:0;if(!o.n)return toast('الاسم مطلوب');if(id)Object.assign(S.emps.find(x=>x.id==id),o);else S.emps.push({id:'e'+Date.now(),...o});save();closeM();draw()}
const eDel=id=>ask('حذف الموظف؟ تبقى بيانات المسيرات السابقة محفوظة.',()=>{S.emps=S.emps.filter(e=>e.id!=id);save();draw()});
const NI=(i,k,v)=>`<input type="number" step="any" value="${v}" onchange="up(${i},'${k}',this.value)">`;
function up(i,k,v){const R=curRun();R.rows[i][k]=+v||0;if('bho'.includes(k)&&R.m==runs()[0].m){const e=S.emps.find(x=>x.id==R.rows[i].e);if(e)e[k]=+v||0}save();draw()}
function vPay(){const R=curRun();let h=`<div class="bar"><select onchange="st.run=this.value;draw()">`+runs().map(r=>`<option value="${r.m}" ${R&&r.m==R.m?'selected':''}>${fm(r.m)}</option>`).join('')+`</select><button class="p" onclick="newRun()">+ مسير جديد</button>`+(R?`<button onclick="impN()">استيراد الملاحظات</button><button onclick="gosiSync()">تأمينات السعوديين</button><button onclick="addRow()">+ موظف</button><button onclick="printRun()">طباعة PDF</button><button class="d" onclick="delRun()">حذف المسير</button>`:'')+qi()+'</div>';
if(!R)return h+'<p class="mu">لا توجد مسيرات — أنشئ مسيراً جديداً.</p>';const C=R.rows.map(c);
return h+'<div class="w"><table><tr><th>#</th><th>الموظف</th><th>أساسي</th><th>سكن</th><th>أخرى</th><th>الإجمالي</th><th>أيام غياب</th><th>خصم الغياب</th><th>أيام إضافي</th><th>قيمة الإضافي</th><th>عمولات/مكافآت</th><th>تأمينات</th><th>ذمم/سلف</th><th>أقساط السلف</th><th>الصافي</th><th>المدفوع</th><th>المتبقي</th><th></th></tr>'+R.rows.map((r,i)=>hit(E(r.e).n)?`<tr><td>${i+1}</td><td>${esc(E(r.e).n)}</td><td>${NI(i,'b',r.b)}</td><td>${NI(i,'h',r.h)}</td><td>${NI(i,'o',r.o)}</td><td>${f(C[i].g)}</td><td>${NI(i,'dn',r.dn)}</td><td>${f(C[i].ad)}</td><td>${NI(i,'od',r.od)}</td><td>${f(C[i].ov)}</td><td>${NI(i,'cm',r.cm)}</td><td>${NI(i,'ins',r.ins)}</td><td>${NI(i,'db',r.db)}</td><td>${f(r.ln||0)}</td><td><b>${f(C[i].net)}</b></td><td>${f(paid(r.e,R.m))}</td><td>${f(C[i].net-paid(r.e,R.m))}</td><td><button onclick="payAdd('${R.m}','${r.e}')">دفعة</button> <button onclick="recPrint('${R.m}','${r.e}')">إقرار</button> <button onclick="st.emp='${r.e}';st.rm='${R.m}';go('rep')">قسيمة</button> <button class="d" onclick="delRow(${i})">✕</button></td></tr>`:'').join('')+`<tfoot><tr><td></td><td>الإجمالي</td><td>${f(sm(R.rows,x=>x.b))}</td><td>${f(sm(R.rows,x=>x.h))}</td><td>${f(sm(R.rows,x=>x.o))}</td><td>${f(sm(C,x=>x.g))}</td><td>${f(sm(R.rows,x=>x.dn))}</td><td>${f(sm(C,x=>x.ad))}</td><td>${f(sm(R.rows,x=>x.od))}</td><td>${f(sm(C,x=>x.ov))}</td><td>${f(sm(R.rows,x=>x.cm))}</td><td>${f(sm(R.rows,x=>x.ins))}</td><td>${f(sm(R.rows,x=>x.db))}</td><td>${f(sm(R.rows,x=>x.ln||0))}</td><td>${f(sm(C,x=>x.net))}</td><td>${f(sm(R.rows,x=>paid(x.e,R.m)))}</td><td>${f(sm(C,x=>x.net)-sm(R.rows,x=>paid(x.e,R.m)))}</td><td></td></tr></tfoot></table></div>`}
function newRun(){const L=runs()[0];openM(`<h3>مسير جديد</h3><p class="mu">يُنشأ من الموظفين النشطين بآخر رواتبهم المسجلة.</p><input type="month" id="nm" value="${L?nextM(L.m):today().slice(0,7)}"><div class="bar" style="margin-top:10px"><button class="p" onclick="mkRun()">إنشاء</button><button onclick="closeM()">إلغاء</button></div>`)}

const delRun=()=>ask('حذف هذا المسير نهائياً؟',()=>{S.runs=S.runs.filter(r=>r.m!=curRun().m);st.run=null;save();draw()});
const delRow=i=>ask('حذف الموظف من هذا المسير؟',()=>{curRun().rows.splice(i,1);save();draw()});
function addRow(){const R=curRun(),L=S.emps.filter(e=>!R.rows.some(r=>r.e==e.id));if(!L.length)return toast('كل الموظفين موجودون');openM('<h3>إضافة موظف للمسير</h3><select id="ar">'+L.map(e=>`<option value="${e.id}">${esc(e.n)}</option>`).join('')+'</select><div class="bar" style="margin-top:10px"><button class="p" onclick="doAdd()">إضافة</button><button onclick="closeM()">إلغاء</button></div>')}
function doAdd(){const e=E($('#ar').value);curRun().rows.push({e:e.id,b:e.b,h:e.h,o:e.o,dn:0,cm:0,od:0,ins:gEE(e,e.b+e.h),db:0});syncLn();save();closeM();draw()}
function impN(){const R=curRun();let k=0;R.rows.forEach(r=>{const n=S.notes.find(x=>x.m==R.m&&x.e==r.e);if(n){r.dn=n.ab;r.od=n.ot;r.cm=n.bn;r.db=n.tg+n.pn;k++}});save();draw();toast('تم استيراد ملاحظات '+k+' موظف: غياب، إضافي، مكافأة، وخصم أهداف + جزاء/سلف ضمن الذمم')}

function printRun(){const R=curRun(),C=R.rows.map(c);pr(hd('كشف رواتب شهر '+fm(R.m))+'<table><tr><th>م</th><th>الموظف</th><th>الوظيفة</th><th>الإجمالي</th><th>أيام غياب</th><th>خصم الغياب</th><th>الإضافي</th><th>العمولات</th><th>التأمينات</th><th>الذمم والسلف</th><th>الصافي</th></tr>'+R.rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(E(r.e).n)}</td><td>${esc(E(r.e).j)}</td><td>${f(C[i].g)}</td><td>${r.dn}</td><td>${f(C[i].ad)}</td><td>${f(C[i].ov)}</td><td>${f(r.cm)}</td><td>${f(r.ins)}</td><td>${f(r.db+(r.ln||0))}</td><td><b>${f(C[i].net)}</b></td></tr>`).join('')+`<tr><th colspan="3">الإجمالي</th><th>${f(sm(C,x=>x.g))}</th><th>${f(sm(R.rows,x=>x.dn))}</th><th>${f(sm(C,x=>x.ad))}</th><th>${f(sm(C,x=>x.ov))}</th><th>${f(sm(R.rows,x=>x.cm))}</th><th>${f(sm(R.rows,x=>x.ins))}</th><th>${f(sm(R.rows,x=>x.db+(x.ln||0)))}</th><th>${f(sm(C,x=>x.net))}</th></tr></table><div class="sg"><span>شؤون الموظفين</span><span>${stamp()}</span><span>المدير المالي</span><span>رئيس مجلس الإدارة</span></div>`,'landscape')}
const NF=[['ab','غيابات'],['ot','إضافي (أيام)'],['tg','خصم أهداف'],['bn','مكافأة'],['pn','جزاء/سلف']];
function vNotes(){const m=st.nm,ids=[...new Set([...S.emps.filter(e=>e.st).map(e=>e.id),...S.notes.filter(n=>n.m==m).map(n=>n.e)])];

/* ===== A4: صفحات مضبوطة + لوحة تعبئة النماذج ===== */
function a4Pages(h){const PH=1123,PW=794,box=document.createElement('div');box.style.cssText='position:absolute;left:-99999px;top:0;width:'+PW+'px;direction:rtl';box.innerHTML=h;document.body.appendChild(box);const ff=box.querySelector('.ff');if(!ff){box.remove();return[h]}
ff.style.cssText+=';width:'+PW+'px;margin:0;box-shadow:none;min-height:0';const tot=ff.offsetHeight,FS=(w,mh)=>'<div class="ff" style="width:'+w+'px;min-height:'+mh+'px;margin:0;box-shadow:none"';
if(tot<=PH){box.remove();return['<div class="a4pg">'+ff.outerHTML.replace(/^<div class="ff"[^>]*/,FS(PW,PH))+'</div>']}
const sc=PH/tot;if(sc>=.64){const W=Math.round(PW/sc);box.remove();return['<div class="a4pg"><div class="a4sc" style="width:'+W+'px;transform:scale('+sc.toFixed(4)+')">'+ff.outerHTML.replace(/^<div class="ff"[^>]*/,FS(W,Math.ceil(PH/sc)))+'</div></div>']}
const cs=getComputedStyle(ff),pt=parseFloat(cs.paddingTop),pb=parseFloat(cs.paddingBottom),AV=PH-pt-pb-26,deco=[...ff.querySelectorAll(':scope>.tp,:scope>.bt')].map(x=>x.outerHTML).join(''),K=[...ff.children].filter(c=>!c.matches('.tp,.bt'));
const ht=(c,i)=>{const nx=K[i+1];return(nx?nx.offsetTop:ff.offsetHeight-pb)-c.offsetTop};const P=[[]];let used=0;
K.forEach((c,i)=>{let hh=ht(c,i);if(used+hh<=AV||!P[P.length-1].length&&c.tagName!='TABLE'){P[P.length-1].push(c.outerHTML);used+=hh;return}
if(c.tagName=='TABLE'&&c.rows.length>2){const R=[...c.rows],hd=R[0].querySelector('th')?R.shift():null,hH=hd?hd.offsetHeight:0,op='<table class="'+c.className+'">'+(hd?hd.outerHTML:'');let buf=[],bh=0;
const flush=()=>{if(buf.length){P[P.length-1].push(op+buf.join('')+'</table>');used+=hH+bh+6;buf=[];bh=0}};
R.forEach(r=>{const rh=r.offsetHeight;if(used+hH+bh+rh>AV&&(buf.length||P[P.length-1].length)){flush();P.push([]);used=0}buf.push(r.outerHTML);bh+=rh});flush();return}
P.push([c.outerHTML]);used=hh});
box.remove();const N=P.length;return P.map((pg,i)=>'<div class="a4pg">'+FS(PW,PH)+'>'+deco+pg.join('')+'<div class="a4n">'+(i+1)+' / '+N+'</div></div></div>')}
const lfA4=()=>{const o=lfOut(),pg=a4Pages(o.h);openM(`<h3>معاينة الطباعة — ${pg.length} ${pg.length>1?'صفحات':'صفحة'} A4</h3><p class="mu">هكذا سيخرج النموذج في ملف PDF والطباعة: مقاس A4 كامل، والنموذج الطويل يُصغَّر ليدخل في صفحة واحدة أو يُقسَّم بين الصفحات دون قطع الصفوف.</p><div class="a4v">${pg.map(p=>`<div class="a4t">${p}</div>`).join('')}</div><div class="bar" style="margin-top:10px"><button class="p" onclick="closeM();lfPdf()">🖨️ طباعة / PDF</button><button onclick="closeM()">إغلاق</button></div>`)};
function lfEls(r){const F=[...r.querySelectorAll('.fl')],C=[...r.querySelectorAll('.ck')],T=[];r.querySelectorAll('table.ft').forEach(t=>{const car=t.classList.contains('car');[...t.rows].forEach(tr=>{const cs=[...tr.cells];cs.forEach((td,ci)=>{if(td.tagName!='TD'||td.children.length||/\b(tr|tl|gs|gy|gh)\b/.test(td.className))return;if(car&&(ci==0||ci==cs.length-1))return;if(ci==0&&/^\d+$/.test(td.textContent.trim()))return;T.push({td,t,tr,ci})})})});

if(G.length)h+=`<details open><summary>النصوص والملاحظات (${G.length})</summary>${G.map((g,i)=>`<label for="lfg${i}">${esc(lfLab(g[0].previousElementSibling))}</label><textarea id="lfg${i}" rows="${Math.min(5,g.length+1)}" oninput="lfSet('g',${i},this.value)">${esc(g[0].dataset.t||'')}</textarea>`).join('')}</details>`;
if(T.length){const by=new Map();T.forEach((c,i)=>{if(!by.has(c.t))by.set(c.t,new Map());const m=by.get(c.t);if(!m.has(c.tr))m.set(c.tr,[]);m.get(c.tr).push([c,i])});let k=0;
h+=`<details open><summary>الجداول (${by.size})</summary>${[...by].map(([t,rows])=>{k++;const hd=t.rows[0],hn=ci=>{const c=hd&&hd.cells[ci];return c?[...c.childNodes].map(n=>n.textContent).join(' ').replace(/\s+/g,' ').trim().slice(0,30):''};return`<div class="cklb">جدول ${k}</div>`+[...rows].map(([tr,cs])=>{const lbc=[...tr.cells].find(c=>!cs.some(([x])=>x.td===c));return`<div class="pt"><b>${esc(lbc?lbc.textContent.replace(/\s+/g,' ').trim().slice(0,28):'')}</b><div class="pti">${cs.map(([c,i])=>`<input id="lft${i}" title="${esc(hn(c.ci))}" placeholder="${esc(hn(c.ci))}" value="${esc(c.td.textContent.replace(/ /g,'').trim())}" oninput="lfSet('t',${i},this.value)">`).join('')}</div></div>`}).join('')}).join('')}</details>`}
return h||'<p class="mu">لا توجد حقول قابلة للتعبئة في هذا النموذج. فعّل «تعديل النموذج» للكتابة مباشرة.</p>'}
function lfSet(k,i,v){const r=$('#lfd');if(!r)return;const E2=lfEls(r);
if(k=='f'){const x=E2.F[i];if(x)x.querySelector('.v').textContent=v}
else if(k=='c'){const[a,b]=String(i).split('_').map(Number),ci=E2.C[a]&&E2.C[a].querySelectorAll('.ci')[b];if(ci)ci.querySelector('i').textContent=v?'✓':''}
else if(k=='t'){const c=E2.T[i];if(c)c.td.innerHTML=v?esc(v):'&nbsp;'}

lfIn()}
